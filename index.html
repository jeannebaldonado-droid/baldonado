<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Socket.IO Messaging UI</title>
		<style>
			:root{--bg:#f4f7fb;--panel:#ffffff;--accent:#2b6ef6;--muted:#65748b}
			html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#0b1220}
			.app{max-width:1000px;margin:28px auto;background:transparent;display:grid;grid-template-columns:260px 1fr;gap:18px;padding:12px}
			.panel{background:var(--panel);border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(11,18,32,0.06)}
			.sidebar{display:flex;flex-direction:column;height:720px}
			.logo{font-weight:700;color:var(--accent);font-size:18px;margin-bottom:12px}
			.users{flex:1;overflow:auto;margin-top:8px}
			.user{padding:10px;border-radius:8px;margin-bottom:8px;background:#f6f8fb;display:flex;align-items:center}
			.user .dot{width:10px;height:10px;border-radius:50%;background:#30c27d;margin-right:8px}
			.main{display:flex;flex-direction:column;height:720px}
			.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
			.status{font-size:13px;color:var(--muted)}
			.messages{flex:1;overflow:auto;padding:12px;border-radius:8px;background:linear-gradient(180deg,#ffffff, #fbfdff)}
			.message{margin-bottom:10px}
			.message .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
			.message .text{background:#f1f6ff;padding:10px;border-radius:8px;display:inline-block}
			.composer{display:flex;gap:8px;margin-top:12px}
			.composer input[type=text]{flex:1;padding:10px;border-radius:8px;border:1px solid #e6eefc}
			.composer button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
			.connectRow{display:flex;gap:8px;align-items:center}
			.connectRow input{padding:8px;border-radius:8px;border:1px solid #e3e8ef}
			.small{font-size:13px;color:var(--muted)}
			@media(max-width:880px){.app{grid-template-columns:1fr;max-width:720px}.sidebar{order:2}.main{order:1}}
		</style>
	</head>
	<body>
		<div class="app">
			<aside class="panel sidebar">
				<div class="logo">Messaging • Socket.IO</div>
				<div class="small">Connected users</div>
				<div id="users" class="users" aria-live="polite"></div>
				<div style="margin-top:12px;font-size:12px;color:var(--muted)">Tip: enter a username and press Connect.</div>
			</aside>

			<main class="panel main">
				<div class="header">
					<div>
						<div style="font-weight:700">Group Chat</div>
						<div id="status" class="status">Not connected</div>
					</div>
					<div class="connectRow">
						<input id="username" placeholder="Your name" />
						<button id="connectBtn">Connect</button>
					</div>
				</div>

				<div id="messages" class="messages" aria-live="polite"></div>

				<form id="sendForm" class="composer" onsubmit="return false;">
					<input id="msgInput" type="text" placeholder="Type a message…" disabled />
					<button id="sendBtn" disabled>Send</button>
				</form>
			</main>
		</div>

		<script src="/socket.io/socket.io.js"></script>
		<script src="client.js"></script>
	</body>
</html>
